<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>ローソク足メーカー</title>
<meta name="theme-color" content="#0e1117" />
<link rel="manifest" href="manifest.webmanifest" />

<style>
:root{--bg:#0e1117;--panel:#171c24;--line:#303846;--text:#eef2f7;--muted:#9aa6b2;--accent:#4da3ff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;overflow-x:hidden}
body{min-height:100%}
header{padding:10px 14px 6px}
h1{font-size:18px;line-height:1.2;margin:0 0 3px}.sub{font-size:11px;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:7px;padding:8px 12px;background:var(--panel);border-block:1px solid #222a35}
button{appearance:none;border:1px solid #354050;background:#222a35;color:#fff;border-radius:9px;padding:8px 10px;font-weight:700;font-size:12px;min-height:40px;touch-action:manipulation}
button:active{transform:translateY(1px)}.up{border-color:#713838}.down{border-color:#23645f}.primary{background:#1f5f9f;border-color:#327fc9}.danger{color:#ff9c9c}
.wrap{width:100%;max-width:1180px;margin:0 auto;padding:9px 12px 14px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:9px;align-items:start}
.stage{background:#0b0e13;border:1px solid #27303c;border-radius:11px;overflow:hidden;min-width:0}
canvas{display:block;width:100%;height:520px;max-height:65vh;touch-action:none}
.hint{grid-column:1;font-size:11px;color:var(--muted);padding:0 3px;line-height:1.35}
.editor{grid-column:2;grid-row:1 / span 2;background:var(--panel);border:1px solid #27303c;border-radius:11px;padding:10px;min-width:0}
.editor h2{font-size:13px;margin:0 0 8px}
.grid{display:grid;grid-template-columns:1fr;gap:8px}
.field label{display:block;color:var(--muted);font-size:10px;margin-bottom:2px}.field input{width:100%;accent-color:var(--accent)}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:9px}
.row button{font-size:11px;padding:6px 4px;min-height:36px}
.badge{display:inline-block;padding:2px 6px;border-radius:999px;background:#252d39;color:#cbd5df;font-size:10px;margin-left:5px}

@media(max-width:799px){
  body{padding-bottom:env(safe-area-inset-bottom)}
  header{padding:7px 10px 5px}
  h1{font-size:16px;margin:0}.sub{display:none}
  .toolbar{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:5px;
    padding:6px 7px;
    position:sticky;
    top:0;
    z-index:10;
  }
  .toolbar button{
    min-width:0;
    min-height:42px;
    padding:5px 2px;
    border-radius:8px;
    font-size:10.5px;
    line-height:1.1;
    overflow:hidden;
  }
  .wrap{
    display:flex;
    flex-direction:column;
    gap:6px;
    padding:7px;
    max-width:none;
  }
  .stage{order:1;width:100%;border-radius:9px}
  canvas{
    width:100%;
    height:clamp(300px,52vw + 105px,430px);
    max-height:none;
  }
  .hint{order:2;width:100%;font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
  .editor{
    order:3;
    width:100%;
    padding:7px 8px 8px;
    border-radius:9px;
  }
  .editor h2{font-size:11px;margin:0 0 5px;line-height:1.2}
  .grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .field{min-width:0}
  .field label{font-size:9px;margin:0;white-space:nowrap}
  .field input{display:block;width:100%;height:24px;margin:0}
  .row{grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:5px}
  .row button{min-width:0;min-height:34px;padding:4px 2px;font-size:9.5px;line-height:1.05}
}

@media(max-width:420px){
  header{padding:5px 8px 4px}
  h1{font-size:15px}
  .toolbar{padding:5px;gap:3px}
  .toolbar button{font-size:9.5px;min-height:40px}
  .wrap{padding:5px;gap:5px}
  canvas{height:clamp(285px,92vw,380px)}
  .editor{padding:6px}
  .grid{gap:4px}
  .row{gap:3px}
}

@media(max-width:799px) and (orientation:landscape){
  header{display:none}
  .toolbar{position:static}
  .wrap{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(220px,.8fr);grid-template-rows:auto auto;align-items:start}
  .stage{grid-column:1;grid-row:1}
  canvas{height:64vh;min-height:260px}
  .editor{grid-column:2;grid-row:1 / span 2}
  .editor .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .editor .row{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hint{grid-column:1;grid-row:2}
}

@media(max-height:650px) and (max-width:799px) and (orientation:portrait){
  header{display:none}
  .toolbar{position:static}
  canvas{height:300px}
  .hint{display:none}
}

.line-editor{background:var(--panel);border:1px solid #27303c;border-radius:11px;padding:9px 10px;min-width:0}
.line-editor h2{font-size:13px;margin:0 0 7px}
.line-controls{display:grid;grid-template-columns:minmax(0,1fr) 105px;gap:7px}
.line-controls input,.line-controls select{width:100%;min-width:0;background:#0f141b;color:var(--text);border:1px solid #354050;border-radius:8px;padding:8px;font:inherit;font-size:12px}
.line-actions{display:grid;grid-template-columns:1fr;gap:6px;margin-top:7px}

/* PC: v6のチャート幅を維持し、右カラムに編集パネルを縦積み */
@media(min-width:800px){
  .wrap{
    grid-template-columns:minmax(0,1fr) 300px;
    grid-template-rows:auto auto auto;
  }
  .stage{grid-column:1;grid-row:1 / span 2}
  .hint{grid-column:1;grid-row:3}
  .editor{grid-column:2;grid-row:1}
  .line-editor{grid-column:2;grid-row:2;margin-top:0}
}

/* スマホ: チャート → 足編集 → ライン編集。横幅を圧迫しない */
@media(max-width:799px){
  .line-editor{order:4;width:100%;padding:7px 8px}
  .line-editor h2{font-size:11px;margin-bottom:5px}
  .line-controls{grid-template-columns:minmax(0,1fr) 92px;gap:5px}
  .line-controls input,.line-controls select{font-size:11px;padding:7px}
  .line-actions{margin-top:5px}
  .line-actions button{min-height:34px;font-size:10px}
}

/* スマホ横向き: チャート左、編集系を右側に自然に積む */
@media(max-width:799px) and (orientation:landscape){
  .wrap{
    display:grid;
    grid-template-columns:minmax(0,1.65fr) minmax(220px,.8fr);
    grid-template-rows:auto auto auto;
    align-items:start;
  }
  .stage{grid-column:1;grid-row:1 / span 2}
  .hint{grid-column:1;grid-row:3}
  .editor{grid-column:2;grid-row:1}
  .line-editor{grid-column:2;grid-row:2}
}
</style>

</head>
<body>
<header><h1>ローソク足メーカー <span class="badge">最大10本</span></h1><div class="sub">教材・検証用のローソク足パターンを自由に作成</div></header>
<div class="toolbar">
<button class="up" id="addUp">＋ 陽線</button><button class="down" id="addDown">＋ 陰線</button>
<button id="addLine">＋ ライン</button><button id="undo">↶ 戻す</button><button id="clear" class="danger">全削除</button><button id="save" class="primary">PNG保存</button>
</div>
<div class="wrap">
<div class="stage"><canvas id="cv"></canvas></div>
<div class="hint">ローソク足をタップして選択。足そのものを上下ドラッグすると全体移動。○ハンドルをドラッグすると高値・始値・終値・安値を個別調整できます。</div>
<div class="editor" id="editor">
<h2>選択中：<span id="selLabel">なし</span></h2>
<div class="grid">
<div class="field"><label>高値</label><input id="hi" type="range" min="0" max="100" step="1"></div>
<div class="field"><label>始値</label><input id="op" type="range" min="0" max="100" step="1"></div>
<div class="field"><label>終値</label><input id="cl" type="range" min="0" max="100" step="1"></div>
<div class="field"><label>安値</label><input id="lo" type="range" min="0" max="100" step="1"></div>
</div>
<div class="row"><button id="toggle">陽線/陰線 反転</button><button id="left">← 左へ</button><button id="right">右へ →</button><button id="del" class="danger">この足を削除</button></div>
</div>
<div class="line-editor" id="lineEditor">
<h2>水平ライン：<span id="lineSelLabel">なし</span></h2>
<div class="line-controls">
<input id="lineLabel" type="text" maxlength="40" placeholder="例：ラウンドナンバー / SMA20" disabled>
<select id="lineStyle" disabled><option value="solid">実線</option><option value="dashed">点線</option></select>
</div>
<div class="line-actions"><button id="deleteLine" class="danger" disabled>このラインを削除</button></div>
</div>
</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const addUpBtn=$('addUp'),addDownBtn=$('addDown'),addLineBtn=$('addLine'),undoBtn=$('undo'),clearBtn=$('clear'),saveBtn=$('save');
const delBtn=$('del'),toggleBtn=$('toggle'),leftBtn=$('left'),rightBtn=$('right');
const hiEl=$('hi'),opEl=$('op'),clEl=$('cl'),loEl=$('lo');
const lineLabelEl=$('lineLabel'),lineStyleEl=$('lineStyle'),deleteLineBtn=$('deleteLine');
let candles=[],lines=[],selected=-1,selectedLine=-1,history=[],drag=null;

function state(){return JSON.stringify({candles,lines})}
function snap(){history.push(state());if(history.length>60)history.shift()}
function restore(raw){const x=JSON.parse(raw);candles=x.candles||[];lines=x.lines||[];selected=Math.min(selected,candles.length-1);selectedLine=Math.min(selectedLine,lines.length-1);sync();draw()}
function resize(){const dpr=devicePixelRatio||1,r=cv.getBoundingClientRect();cv.width=r.width*dpr;cv.height=r.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
addEventListener('resize',resize);

function add(up){if(candles.length>=10)return;snap();candles.push(up?{h:75,o:42,c:62,l:25}:{h:75,o:62,c:42,l:25});selected=candles.length-1;selectedLine=-1;sync();draw()}
function addLine(){snap();lines.push({v:50,label:'',style:'solid'});selectedLine=lines.length-1;selected=-1;sync();draw()}

function geom(i){const w=cv.clientWidth,n=Math.max(candles.length,1),preferredGap=82,sideMargin=36;const slot=Math.min(preferredGap,(w-sideMargin*2)/Math.max(n-1,1));const center=w/2,x=center+(i-(n-1)/2)*slot,bw=Math.min(42,slot*.52);return{x,bw}}
function y(v){return 20+(100-v)/100*(cv.clientHeight-40)}
function val(py){return Math.max(0,Math.min(100,100-(py-20)/(cv.clientHeight-40)*100))}

function draw(exporting=false){
 const w=cv.clientWidth,h=cv.clientHeight;ctx.clearRect(0,0,w,h);ctx.fillStyle='#0b0e13';ctx.fillRect(0,0,w,h);
 ctx.strokeStyle='#202733';ctx.lineWidth=1;ctx.setLineDash([]);for(let i=1;i<6;i++){let yy=i*h/6;ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(w,yy);ctx.stroke()}
 // Horizontal lines behind candles.
 for(let i=0;i<lines.length;i++){
   const ln=lines[i],yy=y(ln.v);ctx.save();ctx.strokeStyle=i===selectedLine&&!exporting?'#70b7ff':'#d5a84b';ctx.lineWidth=i===selectedLine&&!exporting?2.5:2;ctx.setLineDash(ln.style==='dashed'?[8,6]:[]);
   ctx.beginPath();ctx.moveTo(8,yy);ctx.lineTo(w-8,yy);ctx.stroke();ctx.setLineDash([]);
   if(ln.label){ctx.font='600 12px system-ui,-apple-system,"Noto Sans JP",sans-serif';ctx.textAlign='right';ctx.textBaseline='bottom';const tw=ctx.measureText(ln.label).width;ctx.fillStyle='#0b0e13cc';ctx.fillRect(Math.max(4,w-12-tw-8),yy-18,tw+8,17);ctx.fillStyle='#e7c979';ctx.fillText(ln.label,w-12,yy-3)}
   if(i===selectedLine&&!exporting){ctx.fillStyle='#e9f4ff';ctx.strokeStyle='#4da3ff';ctx.beginPath();ctx.arc(16,yy,6,0,Math.PI*2);ctx.fill();ctx.stroke()}
   ctx.restore();
 }
 for(let i=0;i<candles.length;i++){
   const c=candles[i],g=geom(i),up=c.c>=c.o,col=up?'#ef5350':'#26a69a';ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=2;ctx.setLineDash([]);
   ctx.beginPath();ctx.moveTo(g.x,y(c.h));ctx.lineTo(g.x,y(c.l));ctx.stroke();let yt=Math.min(y(c.o),y(c.c)),yb=Math.max(y(c.o),y(c.c));ctx.fillRect(g.x-g.bw/2,yt,g.bw,Math.max(3,yb-yt));
   if(i===selected&&!exporting){ctx.strokeStyle='#70b7ff';ctx.lineWidth=2;ctx.strokeRect(g.x-g.bw/2-5,y(c.h)-9,g.bw+10,y(c.l)-y(c.h)+18);[['h',c.h],['o',c.o],['c',c.c],['l',c.l]].forEach(([k,v])=>{ctx.beginPath();ctx.fillStyle='#e9f4ff';ctx.strokeStyle='#4da3ff';ctx.arc(g.x,y(v),6,0,Math.PI*2);ctx.fill();ctx.stroke()})}
   ctx.save();ctx.font='600 14px system-ui,-apple-system,Segoe UI,sans-serif';ctx.textAlign='center';ctx.textBaseline='bottom';ctx.fillStyle='#b8c2cf';ctx.fillText(String(i+1),g.x,h-5);ctx.restore();
 }
}

function hitCandle(px,py){for(let i=candles.length-1;i>=0;i--){let g=geom(i),c=candles[i];if(Math.abs(px-g.x)<g.bw*.8&&py>=y(c.h)-14&&py<=y(c.l)+14)return i}return -1}
function hitLine(py){let best=-1,dist=13;for(let i=lines.length-1;i>=0;i--){let d=Math.abs(py-y(lines[i].v));if(d<dist){dist=d;best=i}}return best}
function pointer(e){const r=cv.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:p.clientX-r.left,y:p.clientY-r.top}}

function start(e){
 e.preventDefault();const p=pointer(e),ci=hitCandle(p.x,p.y);
 if(ci>=0){selected=ci;selectedLine=-1;sync();const c=candles[ci],keys=['h','o','c','l'],nearest=keys.map(k=>[k,Math.abs(p.y-y(c[k]))]).sort((a,b)=>a[1]-b[1])[0];snap();drag={type:'candle',key:nearest[1]<12?nearest[0]:'all',startY:p.y,orig:{...c}};draw();return}
 const li=hitLine(p.y);
 if(li>=0){selectedLine=li;selected=-1;sync();snap();drag={type:'line'};draw();return}
 selected=-1;selectedLine=-1;sync();draw();
}
function move(e){
 if(!drag)return;e.preventDefault();const p=pointer(e);
 if(drag.type==='line'&&selectedLine>=0){lines[selectedLine].v=val(p.y);draw();return}
 if(drag.type==='candle'&&selected>=0){let c=candles[selected];if(drag.key==='all'){let dv=val(p.y)-val(drag.startY);for(let k of ['h','o','c','l'])c[k]=Math.max(0,Math.min(100,drag.orig[k]+dv))}else c[drag.key]=val(p.y);normalize(c,drag.key);sync();draw()}
}
function end(){drag=null}
function normalize(c,key){c.h=Math.max(c.h,c.o,c.c,c.l);c.l=Math.min(c.l,c.o,c.c,c.h);if(key==='h'){c.o=Math.min(c.o,c.h);c.c=Math.min(c.c,c.h);c.l=Math.min(c.l,c.h)}if(key==='l'){c.o=Math.max(c.o,c.l);c.c=Math.max(c.c,c.l);c.h=Math.max(c.h,c.l)}}

cv.addEventListener('mousedown',start);cv.addEventListener('mousemove',move);addEventListener('mouseup',end);
cv.addEventListener('touchstart',start,{passive:false});cv.addEventListener('touchmove',move,{passive:false});cv.addEventListener('touchend',end);

function sync(){
 const c=candles[selected];$('selLabel').textContent=c?`${selected+1}本目（${c.c>=c.o?'陽線':'陰線'}）`:'なし';
 for(const id of ['hi','op','cl','lo'])$(id).disabled=!c;
 if(c){hiEl.value=c.h;opEl.value=c.o;clEl.value=c.c;loEl.value=c.l}
 const ln=lines[selectedLine];$('lineSelLabel').textContent=ln?`${selectedLine+1}本目`:'なし';lineLabelEl.disabled=!ln;lineStyleEl.disabled=!ln;deleteLineBtn.disabled=!ln;
 if(ln){lineLabelEl.value=ln.label;lineStyleEl.value=ln.style}else{lineLabelEl.value='';lineStyleEl.value='solid'}
}
[['hi','h'],['op','o'],['cl','c'],['lo','l']].forEach(([id,k])=>$(id).oninput=e=>{if(selected<0)return;candles[selected][k]=+e.target.value;normalize(candles[selected],k);sync();draw()});

addUpBtn.onclick=()=>add(true);addDownBtn.onclick=()=>add(false);addLineBtn.onclick=addLine;
undoBtn.onclick=()=>{if(history.length)restore(history.pop())};
clearBtn.onclick=()=>{if(!candles.length&&!lines.length)return;snap();candles=[];lines=[];selected=-1;selectedLine=-1;sync();draw()};
delBtn.onclick=()=>{if(selected<0)return;snap();candles.splice(selected,1);selected=Math.min(selected,candles.length-1);sync();draw()};
toggleBtn.onclick=()=>{if(selected<0)return;snap();const c=candles[selected];[c.o,c.c]=[c.c,c.o];sync();draw()};
leftBtn.onclick=()=>{if(selected<=0)return;snap();[candles[selected-1],candles[selected]]=[candles[selected],candles[selected-1]];selected--;sync();draw()};
rightBtn.onclick=()=>{if(selected<0||selected>=candles.length-1)return;snap();[candles[selected+1],candles[selected]]=[candles[selected],candles[selected+1]];selected++;sync();draw()};
lineLabelEl.addEventListener('focus',()=>{if(selectedLine>=0)snap()});
lineLabelEl.addEventListener('input',e=>{if(selectedLine<0)return;lines[selectedLine].label=e.target.value;draw()});
lineStyleEl.addEventListener('change',e=>{if(selectedLine<0)return;snap();lines[selectedLine].style=e.target.value;draw()});
deleteLineBtn.onclick=()=>{if(selectedLine<0)return;snap();lines.splice(selectedLine,1);selectedLine=Math.min(selectedLine,lines.length-1);sync();draw()};
saveBtn.onclick=()=>{const oldC=selected,oldL=selectedLine;selected=-1;selectedLine=-1;draw(true);const a=document.createElement('a');a.download='candlestick-pattern.png';a.href=cv.toDataURL('image/png');a.click();selected=oldC;selectedLine=oldL;draw()};

add(true);add(false);add(true);history=[];resize();sync();
</script>
</body></html>
